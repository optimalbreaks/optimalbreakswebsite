# Pase diario de Beatport — 12:05 hora de Madrid. Listado de Breaks.
#
# Las fichas de los 140 van aparte, cada día a las 13:00
# (beatport-artists.yml). Este workflow no las abre.
#
# Corre aquí y no en el cron de Vercel: con Chrome, Vercel mata la función
# a los 300 s (9 oct 2026: arrancó a las 12:05 y la cortaron sin terminar).
#
# Mismo script que en local: `npx tsx scripts/beatport-daily-import.ts`.
# Listado de Breaks del día → pendientes en /administrator/imports.
# Un crédito de los 140 se publica directo.
name: Pase diario de Beatport

on:
  schedule:
    # GitHub va en UTC y este schedule llega horas tarde (9–11 oct 2026).
# El aviso de las 12:05 lo da pg_cron (migración 090): workflow_dispatch, sin --force.
# Estas dos líneas se quedan de repuesto. 12:05 Madrid = 10:05 UTC en verano, 11:05 UTC en invierno.
# Cerrado el 12 oct 2026: el de las 10:05 UTC entró solo (527 / 5 publicados / 32 pendientes);
# el de las 11:05 UTC vio el pase del día hecho y no lo repitió.
    - cron: '5 10 * * *'
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Lanzarlo aunque no sean las 12 en Madrid'
        type: boolean
        default: true
      artists:
        description: 'Leer también las fichas de los 140 (a mano; el cron de las 13:00 ya las lee cada día)'
        type: boolean
        default: false

concurrency:
  group: beatport-daily
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Pase (Breaks → pendientes · crédito de los 140 → publicado)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          ARTISTS=""
          if [ "${{ inputs.artists }}" = "true" ]; then ARTISTS="--artists"; fi
          npx tsx scripts/beatport-daily-import.ts $FORCE $ARTISTS

      # Lo que antes hacía Narciso a mano tras publicar una semana
      # (`npm run db:chart:spotify` / `db:chart:tidal`). Solo temas ya a la venta
      # (release_date hasta hoy, dos semanas atrás para reintentar los que la
      # tienda aún no tenía): un adelanto no está en Spotify ni TIDAL.
      # Si Spotify corta por cuota (429) el paso queda amarillo, no rojo.
      - name: Enlaces Spotify (temas publicados)
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          FROM=$(date -u -d '14 days ago' +%F); UNTIL=$(date -u -d 'tomorrow' +%F)
          node scripts/spotify-match-charts.mjs --service=spotify --table=featured --from=$FROM --until=$UNTIL

      - name: Enlaces TIDAL (temas publicados)
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
        run: |
          FROM=$(date -u -d '14 days ago' +%F); UNTIL=$(date -u -d 'tomorrow' +%F)
          node scripts/spotify-match-charts.mjs --service=tidal --table=featured --from=$FROM --until=$UNTIL
